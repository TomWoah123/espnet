batch_type: numel
batch_bins: 2000000
accum_grad: 16
max_epoch: 60
patience: none
init: none
best_model_criterion:
-   - valid
    - cer_ctc
    - min
keep_nbest_models: 10

frontend: default
frontend_conf:
    n_fft: 512
    win_length: 400
    hop_length: 160

encoder: hnet
encoder_conf:
    hidden_size: 256
    num_encoder_layers: 2
    num_main_layers: 2
    num_decoder_layers: 2
    downsample_rate: 4
    mamba_d_state: 16
    mamba_d_conv: 4
    mamba_expand: 2
    dropout: 0.1

# encoder: transformer
# encoder_conf:
#     output_size: 256
#     attention_heads: 4
#     linear_units: 1024
#     num_blocks: 18
#     dropout_rate: 0.1
#     positional_dropout_rate: 0.1
#     attention_dropout_rate: 0.1
#     normalize_before: true
#     pos_enc_layer_type: rel_pos

model_conf:
    ctc_weight: 1.0
    lsm_weight: 0.1
    length_normalized_loss: false

optim: adam
optim_conf:
    lr: 0.002
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 15000

num_att_plot: 0

specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 27
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range:
    - 0.
    - 0.05
    num_time_mask: 5

use_wandb: true
wandb_project: "espnet_librispeech_ctc"
wandb_name: "hnet_ctc"
wandb_id: null
wandb_model_log_interval: 500

token_list: "/ocean/projects/cis250187p/twu13/final-project/espnet/egs2/librispeech_100/asr1/data/en_token_list/bpe_unigram5000/tokens.txt"
bpemodel: "/ocean/projects/cis250187p/twu13/final-project/espnet/egs2/librispeech_100/asr1/data/en_token_list/bpe_unigram5000/bpe.model"
